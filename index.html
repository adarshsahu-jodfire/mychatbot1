<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --user: #2563eb;
    --bot: #ffffff;
    --code: #111827;
}

body.dark {
    --bg: #0b1120;
    --panel: #111827;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #263244;
    --bot: #172033;
    --code: #020617;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    padding: 12px;
    margin-bottom: 15px;
}

.new-chat {
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
}

.new-chat:hover {
    background: var(--bg);
}

.sidebar-bottom {
    margin-top: auto;
}

.sidebar button {
    margin-top: 8px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* HEADER */

.header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.header-title {
    font-weight: 600;
}

.model {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.header-actions button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15px;
}

.messages {
    width: 100%;
    max-width: 850px;
    margin: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
    background: var(--primary);
    color: white;
}

.message.bot .avatar {
    background: #10b981;
}

.bubble {
    max-width: 75%;
    padding: 13px 16px;
    border-radius: 15px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: var(--user);
    color: white;
    border-bottom-right-radius: 4px;
}

.bot .bubble {
    background: var(--bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
}

/* CODE */

pre {
    background: var(--code);
    color: #e5e7eb;
    padding: 15px;
    border-radius: 9px;
    overflow-x: auto;
    margin: 10px 0;
}

code {
    font-family: Consolas, monospace;
}

/* TYPING */

.typing {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 15px;
}

.typing span {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {
    0%, 60%, 100% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-5px);
    }
}

/* INPUT */

.input-area {
    padding: 15px;
    border-top: 1px solid var(--border);
    background: var(--panel);
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    padding: 10px;
    font-family: inherit;
    font-size: 15px;
    max-height: 150px;
}

.send {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.disclaimer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
}

/* MOBILE */

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .header {
        padding: 0 12px;
    }

    .chat {
        padding: 18px 10px;
    }

    .bubble {
        max-width: 85%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🤖 My AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="sidebar-bottom">

            <button class="new-chat" onclick="toggleTheme()">
                🌓 Toggle Theme
            </button>

            <button class="new-chat" onclick="clearHistory()">
                🗑 Clear History
            </button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div>
                <div class="header-title">
                    Groq AI Assistant
                </div>

                <div class="model">
                    Powered by Groq
                </div>
            </div>

            <div class="header-actions">

                <button onclick="newChat()">
                    New Chat
                </button>

            </div>

        </header>


        <!-- CHAT -->
        <section class="chat" id="chat">

            <div class="messages" id="messages">

                <div class="message bot">

                    <div class="avatar">
                        AI
                    </div>

                    <div class="bubble">
                        Hello! 👋

                        I'm your AI assistant powered by Groq.

                        Ask me anything!
                    </div>

                </div>

            </div>

            <div class="messages">

                <div class="typing" id="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Message your AI assistant..."
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div class="disclaimer">
                AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

/*
===========================================================
GROQ CONFIGURATION
===========================================================

IMPORTANT:

DO NOT upload a real API key to a public GitHub repository.

For local testing only, put your NEW key here:

const GROQ_API_KEY = "YOUR_NEW_GROQ_API_KEY";

For a public GitHub Pages website, use a backend/serverless
proxy instead.
===========================================================
*/

const GROQ_API_KEY = "YOUR_NEW_GROQ_API_KEY";


/*
===========================================================
MODEL
===========================================================
*/

const MODEL = "llama-3.3-70b-versatile";


/*
===========================================================
ELEMENTS
===========================================================
*/

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");
const sendButton = document.getElementById("send");


/*
===========================================================
CONVERSATION
===========================================================
*/

let conversation = [
    {
        role: "system",
        content:
        "You are a helpful, friendly and accurate AI assistant. " +
        "Give clear answers and use examples when useful."
    }
];


/*
===========================================================
SEND MESSAGE
===========================================================
*/

async function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }

    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "YOUR_NEW_GROQ_API_KEY"
    ) {

        addMessage(
            "Please add your Groq API key in the JavaScript configuration first. " +
            "For a public GitHub Pages website, do not expose the key in this file.",
            "bot"
        );

        return;
    }


    input.value = "";

    resizeTextarea();


    addMessage(text, "user");


    conversation.push({
        role: "user",
        content: text
    });


    setLoading(true);


    try {

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + GROQ_API_KEY
                },

                body: JSON.stringify({

                    model: MODEL,

                    messages: conversation,

                    temperature: 0.7,

                    max_tokens: 2048

                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error?.message ||
                "Groq API request failed."
            );

        }


        const answer =
            data.choices?.[0]?.message?.content ||
            "I couldn't generate a response.";


        conversation.push({
            role: "assistant",
            content: answer
        });


        addMessage(answer, "bot");


    } catch (error) {

        console.error(error);

        addMessage(
            "❌ Error: " + error.message,
            "bot"
        );

    } finally {

        setLoading(false);

        input.focus();

    }

}


/*
===========================================================
ADD MESSAGE
===========================================================
*/

function addMessage(text, sender) {

    const message = document.createElement("div");

    message.className =
        "message " + sender;


    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        sender === "user" ? "You" : "AI";


    const bubble = document.createElement("div");

    bubble.className = "bubble";


    if (sender === "bot") {

        bubble.innerHTML =
            formatAIResponse(text);

    } else {

        bubble.textContent = text;

    }


    message.appendChild(avatar);

    message.appendChild(bubble);

    messages.appendChild(message);


    scrollToBottom();

}


/*
===========================================================
BASIC MARKDOWN FORMATTER
===========================================================
*/

function formatAIResponse(text) {

    let html = escapeHTML(text);


    // Code blocks
    html = html.replace(
        /```([\s\S]*?)```/g,
        function(match, code) {

            return "<pre><code>" +
                code.trim() +
                "</code></pre>";

        }
    );


    // Bold
    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );


    // Italic
    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );


    // Line breaks
    html = html.replace(
        /\n/g,
        "<br>"
    );


    return html;

}


/*
===========================================================
ESCAPE HTML
===========================================================
*/

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/*
===========================================================
LOADING
===========================================================
*/

function setLoading(state) {

    typing.style.display =
        state ? "flex" : "none";

    sendButton.disabled = state;

    scrollToBottom();

}


/*
===========================================================
SCROLL
===========================================================
*/

function scrollToBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;

}


/*
===========================================================
NEW CHAT
===========================================================
*/

function newChat() {

    conversation = [
        {
            role: "system",
            content:
            "You are a helpful, friendly and accurate AI assistant. " +
            "Give clear answers and use examples when useful."
        }
    ];


    messages.innerHTML = "";


    addMessage(
        "New conversation started! 👋 How can I help you?",
        "bot"
    );

}


/*
===========================================================
CLEAR HISTORY
===========================================================
*/

function clearHistory() {

    localStorage.removeItem("chatHistory");

    newChat();

}


/*
===========================================================
THEME
===========================================================
*/

function toggleTheme() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );

}


/*
===========================================================
LOAD THEME
===========================================================
*/

if (
    localStorage.getItem("darkMode") === "true"
) {

    document.body.classList.add("dark");

}


/*
===========================================================
TEXTAREA
===========================================================
*/

input.addEventListener(
    "input",
    resizeTextarea
);


function resizeTextarea() {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight, 150) + "px";

}


/*
===========================================================
ENTER TO SEND

Shift + Enter = new line
===========================================================
*/

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
